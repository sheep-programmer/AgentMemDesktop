[project]
name = "agentmem"
version = "0.1.0"
description = "本地优先的可进化 AI 知识库"
readme = "docs/00-VISION.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "pyyaml>=6.0.1",
    "structlog>=24.1",
    "python-ulid>=2.7",
    "jieba>=0.42.1",
    "tiktoken>=0.7",
    "lancedb>=0.13",
    "pyarrow>=16.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "litellm>=1.44",
    "docling>=2.0",
    "markitdown>=0.1",
]

[project.optional-dependencies]
# 本地 Embedding / Rerank 需要 PyTorch，体积大，故独立为可选依赖
local = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "types-aiofiles>=24.1",
]

[project.scripts]
agentmem = "apps.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/core/agentmem", "apps"]
sources = ["packages/core", "."]
exclude = ["apps/web", "apps/web/**"]

[tool.hatch.build.targets.sdist]
include = ["packages", "apps/api", "config", "tests", "docs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core", "apps/api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
    "ASYNC",
    "T20", # 禁止 print
]
ignore = [
    "B008",    # FastAPI 依赖注入惯用 `Depends()` 作为默认值
    "RUF001",  # 中文注释允许全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# 命令行脚本的输出就是给人看的
"scripts/**" = ["T20"]
"apps/web/scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["agentmem", "apps"]

[tool.mypy]
# 与 .venv 实际使用的解释器一致。写 3.11 时 numpy 的 stub（用了 3.12 的 `type` 语句）
# 会直接报语法错，整个 mypy 在第一个文件就中断——等于类型检查形同虚设。
# 运行时仍然支持 3.11（见 requires-python），由 CI 的多版本测试矩阵把关。
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:."
files = ["packages/core/agentmem", "apps/api", "tests"]
exclude = ["apps/web"]

[[tool.mypy.overrides]]
module = [
    "lancedb",
    "lancedb.*",
    "openai",
    "openai.*",
    "anthropic",
    "anthropic.*",
    "litellm.*",
    "jieba.*",
    "docling.*",
    "markitdown.*",
    "sentence_transformers.*",
    "torch.*",
    "tiktoken.*",
    "ulid.*",
    "pyarrow",
    "pyarrow.*",
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
]
# 第三方库没有类型标注，直接跳过分析，避免它们的类型问题污染本项目的 strict 检查
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages/core", "."]
testpaths = ["tests"]
